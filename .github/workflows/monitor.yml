name: Play Store monitor

# GitHub delays scheduled runs by hours, so each run checks the apps, waits
# 30 minutes, then starts the next run. The cron is only a backup that
# restarts the chain if it ever stops.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write
  actions: write             # needed to start the next run

concurrency:
  group: playstore-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check apps
        run: python3 check.py

      - name: Save results
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Status update" && git pull --rebase && git push)

      - name: Wait 30 minutes
        if: always()
        run: sleep 1800

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
